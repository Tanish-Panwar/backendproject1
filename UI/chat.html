<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial;
            background: #ece5dd;
        }

        #chatContainer {
            width: 400px;
            margin: 30px auto;
            background: #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            padding: 8px 12px;
            margin: 5px;
            border-radius: 10px;
            max-width: 70%;
            position: relative;
            font-size: 14px;
        }

        .sent {
            background: #dcf8c6;
            align-self: flex-end;
        }

        .received {
            background: #fff;
            align-self: flex-start;
        }

        .status {
            font-size: 10px;
            color: gray;
            text-align: right;
            margin-top: 3px;
        }

        #typing {
            font-size: 12px;
            color: gray;
            margin-left: 10px;
        }

        #inputArea {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #msg {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            margin-left: 5px;
        }
    </style>
</head>

<body>

    <div id="chatContainer">
        <div id="chatBox"></div>
        <div id="typing"></div>

        <div id="inputArea">
            <input id="to" placeholder="User ID" style="width:80px;">
            <input id="msg" placeholder="Message..." oninput="sendTyping()" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

    <script>
        const socket = io("http://localhost:3000");
        const userId = prompt("Enter your userId");

        const messagesMap = new Map();

        socket.on("connect", () => {
            socket.emit("join", userId);
        });

        function getStatusSymbol(status) {
            if (status === "sent") return "✓";
            if (status === "delivered") return "✓✓";
            if (status === "seen") return "✓✓";
            return "";
        }

        function getStatusColor(status) {
            return status === "seen" ? "blue" : "gray";
        }

        function addMessage({ id, text, status, type }) {
            if (messagesMap.has(id)) return;

            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.dataset.status = status;
            div.id = `msg-${id}`;

            const msgText = document.createElement("div");
            msgText.innerText = text;

            const statusDiv = document.createElement("div");
            statusDiv.className = "status";
            statusDiv.style.color = getStatusColor(status);
            statusDiv.innerText = getStatusSymbol(status);

            div.appendChild(msgText);
            div.appendChild(statusDiv);

            messagesMap.set(id, { div, statusDiv, type });

            document.getElementById("chatBox").appendChild(div);
            scrollToBottom();
        }

        const statusPriority = { sent: 1, delivered: 2, seen: 3 };

        function updateMessageStatus(messageId, newStatus) {
            const msg = messagesMap.get(messageId);
            if (!msg) return;

            const currentStatus = msg.div.dataset.status || "sent";

            if (statusPriority[newStatus] <= statusPriority[currentStatus]) return;

            msg.div.dataset.status = newStatus;
            msg.statusDiv.innerText = getStatusSymbol(newStatus);
            msg.statusDiv.style.color = getStatusColor(newStatus);
        }

        function sendMessage() {
            const msg = document.getElementById("msg").value;
            const to = document.getElementById("to").value;

            if (!msg || !to) return;

            socket.emit("send_message", {
                from: userId,
                to,
                message: msg
            });

            document.getElementById("msg").value = "";
        }

        function sendTyping() {
            const to = document.getElementById("to").value;
            if (!to) return;

            socket.emit("typing", { from: userId, to });
        }

        function scrollToBottom() {
            const chatBox = document.getElementById("chatBox");
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ✅ SOCKET EVENTS
        socket.on("message_sent", (data) => {
            addMessage({
                id: data.messageId,
                text: data.message,
                status: "sent",
                type: "sent"
            });
        });

        socket.on("receive_message", (data) => {
            addMessage({
                id: data.messageId,
                text: `${data.from}: ${data.message}`,
                status: "delivered",
                type: "received"
            });

            // ✅ mark seen immediately (simulate user reading)
            socket.emit("message_seen", { messageId: data.messageId });
        });

        socket.on("message_delivered", (data) => updateMessageStatus(data.messageId, "delivered"));
        socket.on("message_seen", (data) => updateMessageStatus(data.messageId, "seen"));

        socket.on("chat_history", (messages) => {
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = "";
            messagesMap.clear();

            messages
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
                .forEach(msg => {
                    addMessage({
                        id: msg.id,
                        text: msg.sender_id === userId ? msg.message : `${msg.sender_id}: ${msg.message}`,
                        status: msg.status,
                        type: msg.sender_id === userId ? "sent" : "received"
                    });
                });
        });

        socket.on("typing", (data) => {
            const typingDiv = document.getElementById("typing");
            typingDiv.innerText = `User ${data.from} is typing...`;

            setTimeout(() => {
                typingDiv.innerText = "";
            }, 1000);
        });
    </script>

</body>

</html>
