<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial;
            background: #ece5dd;
        }

        #chatContainer {
            width: 400px;
            margin: 30px auto;
            background: #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .message {
            padding: 8px 12px;
            margin: 5px;
            border-radius: 10px;
            max-width: 70%;
            font-size: 14px;
        }

        .sent {
            background: #dcf8c6;
            align-self: flex-end;
        }

        .received {
            background: #fff;
            align-self: flex-start;
        }

        .status {
            font-size: 10px;
            color: gray;
            text-align: right;
            margin-top: 3px;
        }

        #typing {
            font-size: 12px;
            color: gray;
            margin-left: 10px;
        }

        #inputArea {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #msg {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            margin-left: 5px;
        }
    </style>
</head>

<body>

    <div id="chatContainer">
        <div id="chatBox"></div>
        <div id="typing"></div>

        <div id="inputArea">
            <input id="to" placeholder="User ID" style="width:80px;">
            <input id="msg" placeholder="Message..." oninput="sendTyping()" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

    <script>
        const token = localStorage.getItem("token");

        // 🔥 Decode JWT (simple way)
        const userId = JSON.parse(atob(token.split('.')[1])).id;
        console.log("Logged in as:", userId);

        const socket = io("http://localhost:3000", {
            auth: { token }
        });

        const messagesMap = new Map();

        socket.on("connect", () => {
            console.log("Connected:", socket.id);
            socket.emit("join");
        });

        socket.on("connect_error", (err) => {
            console.error("Connection failed:", err.message);
        });

        function getStatusSymbol(status) {
            if (status === "sent") return "✓";
            if (status === "delivered") return "✓✓";
            if (status === "seen") return "✓✓";
            return "";
        }

        function getStatusColor(status) {
            return status === "seen" ? "blue" : "gray";
        }

        function addMessage({ id, text, status, type }) {
            if (messagesMap.has(id)) return;

            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.dataset.status = status;

            const msgText = document.createElement("div");
            msgText.innerText = text;

            const statusDiv = document.createElement("div");
            statusDiv.className = "status";
            statusDiv.innerText = getStatusSymbol(status);
            statusDiv.style.color = getStatusColor(status);

            div.appendChild(msgText);
            div.appendChild(statusDiv);

            messagesMap.set(id, { div, statusDiv });

            document.getElementById("chatBox").appendChild(div);
            scrollToBottom();
        }

        const statusPriority = { sent: 1, delivered: 2, seen: 3 };

        function updateMessageStatus(messageId, newStatus) {
            const msg = messagesMap.get(messageId);
            if (!msg) return;

            const currentStatus = msg.div.dataset.status || "sent";

            if (statusPriority[newStatus] <= statusPriority[currentStatus]) return;

            msg.div.dataset.status = newStatus;
            msg.statusDiv.innerText = getStatusSymbol(newStatus);
            msg.statusDiv.style.color = getStatusColor(newStatus);
        }

        function sendMessage() {
            const msg = document.getElementById("msg").value;
            const to = document.getElementById("to").value;

            if (!msg || !to) return;

            socket.emit("send_message", {
                to,
                message: msg
            }, (ack) => {
                console.log("ACK:", ack);
            });

            document.getElementById("msg").value = "";
        }

        let typingTimeout;

        function sendTyping() {
            const to = document.getElementById("to").value;
            if (!to) return;

            if (typingTimeout) return;

            socket.emit("typing", { to });

            typingTimeout = setTimeout(() => {
                typingTimeout = null;
            }, 500); // one typing event per 500ms max
        }

        function scrollToBottom() {
            const chatBox = document.getElementById("chatBox");
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ✅ SOCKET EVENTS

        socket.on("message_sent", (data) => {
            console.log("Sent:", data);

            addMessage({
                id: data.messageId,
                text: data.message,
                status: "sent",
                type: "sent"
            });
        });

        socket.on("receive_message", (data) => {
            console.log("Received:", data);

            addMessage({
                id: data.messageId,
                text: `${data.from}: ${data.message}`,
                status: "delivered",
                type: "received"
            });

            // auto mark seen
            socket.emit("message_seen", { messageId: data.messageId });
        });

        socket.on("message_delivered", (data) => {
            console.log("Delivered:", data);
            updateMessageStatus(data.messageId, "delivered");
        });

        socket.on("message_seen", (data) => {
            console.log("Seen:", data);
            updateMessageStatus(data.messageId, "seen");
        });

        // socket.on("chat_history", (messages) => {
        //     console.log("History:", messages);

        //     const chatBox = document.getElementById("chatBox");
        //     chatBox.innerHTML = "";
        //     messagesMap.clear();

        //     messages.forEach(msg => {
        //         addMessage({
        //             id: msg.id,
        //             text: msg.sender_id == userId ? msg.message : `${msg.sender_id}: ${msg.message}`,
        //             status: msg.status,
        //             type: msg.sender_id == userId ? "sent" : "received"
        //         });
        //     });
        // });

        // let typingTimeout;

        socket.on("typing", (data) => {
            const typingDiv = document.getElementById("typing");

            typingDiv.innerText = `User ${data.from} is typing...`;

            // ✅ clear previous timeout
            if (typingTimeout) clearTimeout(typingTimeout);

            // ✅ set new timeout
            typingTimeout = setTimeout(() => {
                typingDiv.innerText = "";
            }, 1500);
        });
    </script>

</body>

</html>
